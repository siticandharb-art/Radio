<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sittic Radio</title>
<meta name="description" content="Radio online: programas, entrevistas e historias locales.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="brand">Sittic Radio</a>
  <nav><a href="#envivo">En vivo</a><a href="#videos">Videos</a><a href="#noticias">Noticias</a><a href="#contacto">Contacto</a></nav>
</header>

<section id="envivo" class="hero">
  <p class="badge"><span class="dot"></span> EN VIVO</p>
  <h1 id="titulo">Sittic Radio</h1>
  <p id="eslogan" class="lead"></p>
  <button id="play" class="play" aria-label="Reproducir">▶</button>
  <p id="estado" class="estado"></p>
  <audio id="audio" preload="none"></audio>
  <label class="vol">Volumen <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
</section>

<section id="videos" class="wrap">
  <h2>Videos</h2>
  <div id="grid-videos" class="grid"></div>
  <p><a id="ver-yt" class="btn" target="_blank" rel="noopener">Ver todos en YouTube</a></p>
</section>

<section id="noticias" class="wrap">
  <h2>Noticias</h2>
  <div id="grid-noticias" class="grid"></div>
</section>

<section id="contacto" class="wrap">
  <h2>Contacto</h2>
  <div id="contactos" class="links"></div>
</section>

<footer>© <span id="anio"></span> Sittic Radio</footer>
<script src="config.js"></script>
<script src="videos.js"></script>
<script src="app.js"></script>
</body>
</html>
