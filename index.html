  :root[data-theme="dark"]{
    --bg:#0b0b0b; --fg:#f3f3f1; --muted:#b0b0aa; --faint:#82827c;
    --rule:#262624; --panel:#161615; --panel-2:#1e1e1c;
    --gold:#d8b968; --gold-bg:#d8b968; --on-gold:#17120a;
    --ph-a:#1a1a18; --ph-b:#121211; --ph-wave:#3b3b36;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom, 0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:70;background:var(--bg)}
  body.lock{overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{display:block}
  :focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;color:var(--fg)}
  .wrap{max-width:1160px;margin:0 auto;padding-left:var(--gx);padding-right:var(--gxr)}
  [data-go]{cursor:pointer}

  /* Cabecera fija */
  .top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:50;background:var(--bg);box-shadow:0 1px 0 var(--rule)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{display:block;height:44px;aspect-ratio:2.262/1;background:var(--fg);-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat;flex:none}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pimg{width:100%;max-height:360px;object-fit:contain;background:#000;border-radius:6px;margin-bottom:14px}
  .wm{display:flex;flex-direction:column;line-height:1}
  .wm b{font:800 20px/1 var(--serif);letter-spacing:.02em}
  .wm i{font:600 9.5px/1 var(--sans);font-style:normal;letter-spacing:.34em;color:var(--muted);margin-top:4px}
  .btn-gold{background:var(--gold-bg);color:var(--on-gold);font:700 13px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase;padding:13px 16px;border-radius:6px;white-space:nowrap}
  .tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule)}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:14px 0 12px;font:600 14.5px/1 var(--sans);color:var(--muted);border-bottom:3px solid transparent}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
  .dsk{display:none}

  /* Barra inferior */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom, 0px);box-shadow:0 -6px 20px rgba(0,0,0,.05)}
  .tabbar button{height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 11.5px/1 var(--sans);color:var(--muted)}
  .tabbar button.on{color:var(--fg);font-weight:700}
  .tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* Fotos de ejemplo */
  .ph{position:relative;aspect-ratio:16/10;background:linear-gradient(160deg,var(--ph-a),var(--ph-b));overflow:hidden;display:grid;place-items:center;color:var(--ph-wave);border-radius:4px}
  .ph .wave{height:44%;width:72%}
  .wave{display:flex;align-items:center;gap:3px}
  .wave i{flex:1 1 0;min-width:2px;max-width:6px;background:currentColor;border-radius:3px;height:var(--h,30%)}
  .kicker{font:700 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
  .meta{font:400 13px/1.4 var(--sans);color:var(--faint)}
  .meta b{font-weight:500;color:var(--muted)}

  /* Portada */
  .home{display:grid;gap:30px;padding-block:22px 10px}
  .today{font:500 13px/1 var(--sans);color:var(--faint);margin-bottom:14px}
  .lead .ph{aspect-ratio:4/3;margin-bottom:16px}
  .lead h2{font-size:clamp(32px,8.6vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.01em;margin:8px 0 10px}
  .lead .dek{font-size:17px;line-height:1.5;color:var(--muted)}
  .lead .meta{margin-top:12px}
  .row{display:grid;grid-template-columns:1fr 112px;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule);align-items:start}
  .row h3{font-size:20px;line-height:1.14;margin-top:6px}
  .row .meta{margin-top:8px}
  .row .ph{aspect-ratio:1/1;border-radius:4px}
  .row .ph .wave{width:76%;height:40%}
  .ct{font:700 12.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding-bottom:12px;border-bottom:2px solid var(--fg)}
  .panel{background:var(--panel);padding:18px 18px 4px;border-radius:8px}
  .panel .ct{border-bottom-color:var(--fg)}
  .plist{list-style:none}
  .plist li{padding:14px 0;border-bottom:1px solid var(--rule);font:700 20px/1.15 var(--serif);cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .plist li small{font:400 12.5px/1.3 var(--sans);color:var(--faint);text-align:right}
  .plist li:last-child{border-bottom:0}
  .cta{background:#111;color:#fff;border-radius:10px;padding:26px 22px;box-shadow:var(--shadow);margin-top:6px}
  :root[data-theme="dark"] .cta{background:var(--panel-2)}
  .cta .kicker{color:#e2c36a}
  .cta h3{color:#fff;font-size:28px;line-height:1.08;margin:10px 0 10px;font-weight:800}
  .cta p{color:#d3d3cf;font-size:15px;line-height:1.5;margin-bottom:18px}
  .cta .btn-gold{display:block;width:100%;padding:15px 12px;text-align:center;white-space:normal}
  .l .row:last-child{border-bottom:0}
  .home .c{order:-1}
  .sbox input::-webkit-search-cancel-button{display:none}
  .big .ph{aspect-ratio:16/9}
  .sec-g{align-items:start}

  .sector{padding-block:26px 8px}
  .sh{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--fg);padding-top:14px;margin-bottom:6px}
  .sh h2{font-size:27px;font-weight:800}
  .sh button{font:600 13.5px/1 var(--sans);color:var(--muted)}
  .sec-g{display:grid;gap:4px}
  .big{padding:14px 0 6px}
  .big .ph{margin-bottom:14px}
  .big h3{font-size:26px;line-height:1.1;margin:7px 0 8px;font-weight:800}
  .big p{color:var(--muted);font-size:15.5px}

  /* Vistas internas */
  .view{padding-block:18px 14px}
  .back{display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--sans);color:var(--muted);padding:6px 0 16px}
  .crumb{font:500 14px/1.2 var(--sans);color:var(--muted);margin-bottom:14px}
  .crumb span{margin:0 6px}

<script>
/* Carga las notas publicadas desde el panel (/admin) y recién después arranca la web. Si falla, se ven las de datos.js. */
(function(){
  var started = false;
  function start(){ if (started) return; started = true; var s = document.createElement('script'); s.src = 'app.js'; document.body.appendChild(s); }
  var t = setTimeout(start, 2500);
  fetch('/api/contenido', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if (!d) return;
    if (Array.isArray(d.secciones) && d.secciones.length) window.SECCIONES = d.secciones;
    if (Array.isArray(d.programas)) {
      var base = {}; PROGRAMAS.forEach(function(p){ base[p.nombre] = p; });
      window.PROGRAMAS = d.programas.map(function(n){ return base[n] || { nombre: n, foto: '', descripcion: '' }; });
    }
    var real = Array.isArray(d.notas) ? d.notas : [];
    if (!real.length) return;
    var ej = NOTAS.filter(function(n){ return SECCIONES.indexOf(n.seccion) >= 0; }), out = real.slice();
    for (var i = 0; out.length < 10 && i < ej.length; i++) out.push(ej[i]);
    window.NOTAS = out;
  }).catch(function(){}).then(function(){ clearTimeout(t); start(); });
})();
</script>
